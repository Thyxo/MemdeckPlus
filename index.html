<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1d17" />
    <meta name="description" content="Memdeck Plus – lær, husk og brug memorerede kortspil (Mnemonica m.fl.)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Memdeck Plus" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Memdeck Plus</title>
    <script>
      // Sæt tema før første paint for at undgå blink.
      try {
        var s = JSON.parse(localStorage.getItem('stackmaster:v1') || '{}');
        var t = (s.settings && s.settings.theme) || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Memdeck Plus kræver JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
